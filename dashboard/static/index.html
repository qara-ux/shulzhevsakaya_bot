<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGINA | Premium Funnel Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.css">
    <script src="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="top-nav">
        <div class="nav-content">
            <div class="logo">
                <span class="logo-text">REGINA</span>
                <span class="badge">PRO</span>
            </div>
            <nav class="nav-links">
                <button onclick="showTab('overview')" class="nav-btn active" data-i18n="nav_overview">Обзор</button>
                <button onclick="showTab('clients')" class="nav-btn" data-i18n="nav_clients">Клиенты</button>
                <button onclick="showTab('planner')" class="nav-btn" data-i18n="nav_planner">Рассылки</button>
                <button onclick="showTab('logs')" class="nav-btn" data-i18n="nav_logs">Активность</button>
                <button onclick="showTab('constructor')" class="nav-btn" data-i18n="nav_constructor">Конструктор</button>
            </nav>
            <div class="header-actions">
                <div class="lang-switcher">
                    <button id="lang-ru" onclick="setLanguage('ru')" class="active">RU</button>
                    <button id="lang-en" onclick="setLanguage('en')">EN</button>
                </div>
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span>LIVE</span>
                </div>
            </div>
        </div>
    </header>

    <main class="dashboard-wrapper">
        <div class="content-area">
            
            <!-- OVERVIEW TAB -->
            <section id="overview-tab" class="tab-content active">
                <div class="premium-stats">
                    <div class="p-card">
                        <span class="p-label" data-i18n="stat_volume">Volume</span>
                        <div class="p-value" id="revenue">0₽</div>
                    </div>
                    <div class="p-card">
                        <span class="p-label" data-i18n="stat_users">Total Users</span>
                        <div class="p-value" id="total_users">0</div>
                    </div>
                    <div class="p-card">
                        <span class="p-label" data-i18n="stat_conv">Conversion</span>
                        <div class="p-value" id="conversion" style="color:var(--warning)">0%</div>
                    </div>
                </div>
                <div class="analytics-layout">
                    <div class="funnel-container">
                        <h3 data-i18n="funnel_title">Conversion Funnel</h3>
                        <div id="visual-funnel" class="visual-funnel"></div>
                    </div>
                    <div class="chart-container">
                        <canvas id="funnelChart"></canvas>
                    </div>
                </div>
            </section>

            <!-- CLIENTS TAB -->
            <section id="clients-tab" class="tab-content">
                <div class="card-header">
                    <h2 data-i18n="crm_title">База клиентов</h2>
                    <div class="search-wrapper">
                        <input type="text" id="crm-search" oninput="filterUsers()" placeholder="Поиск по клиентам...">
                    </div>
                </div>
                <div class="p-card" style="padding: 0; overflow: hidden;">
                    <table class="data-table" id="usersTable">
                        <thead>
                            <tr>
                                <th data-i18n="table_user">User</th>
                                <th data-i18n="table_email">Email</th>
                                <th data-i18n="table_status">Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <!-- PLANNER TAB -->
            <section id="planner-tab" class="tab-content">
                <div class="planner-layout">
                    <div class="planner-card">
                        <h3>Create Broadcast</h3>
                        <div class="planner-form">
                            <textarea id="plan-msg" placeholder="What would you like to send to your users?"></textarea>
                            <button onclick="submitPlan()" class="action-btn">Schedule Broadcast</button>
                        </div>
                    </div>
                    <div class="planner-card">
                        <h3>Upcoming Queue</h3>
                        <div id="plan-queue" class="plan-list"></div>
                    </div>
                </div>
            </section>

            <!-- LOGS TAB -->
            <section id="logs-tab" class="tab-content">
                <div class="logs-layout">
                    <div class="logs-sidebar">
                        <input type="text" id="log-user-search" oninput="filterLogUsers()" placeholder="Search users...">
                        <div id="log-user-list" class="log-user-list"></div>
                    </div>
                    <div class="logs-main">
                        <div id="log-timeline" class="log-timeline">
                            <div class="empty-state">
                                <p data-i18n="logs_select">Select a user to view logs</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- CONSTRUCTOR TAB -->
            <section id="constructor-tab" class="tab-content">
                <div class="constructor-layout">
                    <div id="drawflow">
                        <div class="canvas-controls">
                            <button onclick="editor.zoom_in()">+</button>
                            <button onclick="editor.zoom_out()">-</button>
                            <button onclick="editor.zoom_reset()">↺</button>
                            <button onclick="addNewNode()" class="primary-control" data-i18n="btn_add_node">Создать блок</button>
                        </div>
                    </div>
                    <aside id="node-sidepanel" class="sidepanel">
                        <div class="sidepanel-header">
                            <h3 data-i18n="node_editor">Редактор блока</h3>
                            <button class="close-btn" onclick="closeSidepanel()">✕</button>
                        </div>
                        <div class="sidepanel-content">
                            <div class="form-group">
                                <label data-i18n="label_node_id">ID Блока</label>
                                <input type="text" id="edit-node-id" readonly class="readonly-field">
                            </div>
                            <div class="form-group">
                                <label data-i18n="label_node_title">Название шага</label>
                                <input type="text" id="edit-node-title">
                            </div>
                            <div class="form-group">
                                <label data-i18n="label_node_content">Текст сообщения</label>
                                <textarea id="edit-node-content" style="height:120px"></textarea>
                            </div>
                            <div class="form-group">
                                <label data-i18n="label_node_type">Тип блока</label>
                                <div class="custom-select-wrapper" onclick="toggleSelect('node-type-select')">
                                    <div id="node-type-select" class="modern-select" style="cursor:pointer">
                                        <span id="node-type-val" data-val="main">Основной</span>
                                    </div>
                                    <div class="select-options" id="node-type-options">
                                        <div class="select-option" onclick="selectOption('node-type', 'main', 'Основной')">Основной</div>
                                        <div class="select-option" onclick="selectOption('node-type', 'reminder', 'Дожим')">Дожим</div>
                                    </div>
                                </div>
                            </div>
                            <div id="reminder-settings" class="form-group" style="display:none">
                                <label data-i18n="label_delay">Задержка (напр: 2h)</label>
                                <input type="text" id="edit-node-delay">
                            </div>
                            <div class="form-group">
                                <label data-i18n="label_funnel_stage">Этап воронки</label>
                                <select id="edit-funnel-stage" class="modern-select">
                                    <option value="none">None</option>
                                    <option value="starts">Starts</option>
                                    <option value="engagement">Engagement</option>
                                    <option value="leads">Leads</option>
                                    <option value="payments">Payments</option>
                                    <option value="success">Success</option>
                                </select>
                            </div>
                            <div class="buttons-section">
                                <label data-i18n="label_buttons" style="display:flex; justify-content:space-between;">Кнопки <button onclick="addNodeButton()" style="background:var(--glass); border:1px solid var(--border); color:white; width:24px; height:24px; border-radius:6px; cursor:pointer;">+</button></label>
                                <div id="node-buttons-list" style="margin-top:12px;"></div>
                            </div>
                        </div>
                        <div class="sidepanel-actions">
                            <button class="danger-btn" onclick="deleteCurrentNode()" data-i18n="btn_delete">Удалить</button>
                            <button class="save-btn" onclick="saveNodeData()" data-i18n="btn_save">Сохранить</button>
                        </div>
                    </aside>
                </div>
            </section>

        </div>
    </main>

    <!-- MODAL FOR CONFIRMATIONS -->
    <div id="p-modal" class="p-modal-overlay">
        <div class="p-modal-content">
            <h3 id="p-modal-title">Confirm</h3>
            <p id="p-modal-text" style="color:var(--text-muted); margin-top:12px;"></p>
            <div class="p-modal-footer">
                <button onclick="closePModal()" style="background:var(--glass); border:1px solid var(--border); color:white;">Cancel</button>
                <button id="p-modal-confirm" style="background:white; color:black; border:none;">Confirm</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
